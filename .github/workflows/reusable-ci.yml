name: reusable-ci

on:
  workflow_call:
    inputs:
      node-versions:
        required: false
        type: string
        default: '["20.x","22.x"]'
    outputs:
      artifact-name:
        description: Name of the test artifact
        value: ${{ jobs.test.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: test-results
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload test source artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/
            package.json
          retention-days: 7
